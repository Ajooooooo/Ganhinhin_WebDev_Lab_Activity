<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Box</title>
    <style>
        body { margin: 0; background: #0f0f0f; display: grid; place-items: center; min-height: 100vh; }
        .grid { display: grid; gap: 12px; padding: 12px; background: #1a1a1a; aspect-ratio: 16/10; width: 90vw; max-width: 1100px; grid-template: 37fr 12.5fr 12.5fr 38fr / 18fr 20fr 14fr 23fr 25fr; }
        .grid > div { border-radius: 2px; }

        .b1 { grid-area: 1 / 1 / 4 / 2; background: #CC1414; }
        .b2 { grid-area: 1 / 2 / 2 / 3; background: #0E4EC4; }
        .b3 { grid-area: 1 / 3 / 2 / 5; background: #0EC451; }
        .b4 { grid-area: 2 / 2 / 4 / 4; background: #C5E827; }
        .b5 { grid-area: 2 / 4 / 4 / 5; background: #EB3DE5; }
        .b6 { grid-area: 4 / 1 / 5 / 4; background: #DB2556; }
        .b7 { grid-area: 4 / 4 / 5 / 5; background: #526BE3; }
        .b8 { grid-area: 1 / 5 / 3 / 6; background: #E32B5C; }
        .b9 { grid-area: 3 / 5 / 5 / 6; background: #E38A2B; }
    </style>
</head>
<body>
    <div class="grid">
        <div class="b1"></div>
        <div class="b2"></div>
        <div class="b3"></div>
        <div class="b4"></div>
        <div class="b5"></div>
        <div class="b6"></div>
        <div class="b7"></div>
        <div class="b8"></div>
        <div class="b9"></div>
    </div>
</body>
</html>
